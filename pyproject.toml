[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcompile"
version = "0.1.0"
description = "Ephemeral Antigravity Prompt & Context Compiler"
requires-python = ">=3.11"
authors = [
    { name = "Lead Autonomous Systems Engineer" }
]
dependencies = [
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pcompile = "pcompile.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
